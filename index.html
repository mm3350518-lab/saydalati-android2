
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#159FCA">
<meta name="description" content="صيدليتي - منصة تعليمية للصيدلة والأدوية والحالات السريرية">
<title>صيدليتي | My Pharmacy</title>

<style>
:root {
  --bg: #F3FBFF;
  --card: #FFFFFF;
  --primary: #159FCA;
  --primary-dark: #087FA5;
  --soft: #E4F7FF;
  --text: #173449;
  --muted: #607B8C;
  --border: #D4EAF3;
  --good: #168653;
  --bad: #C43D4B;
  --shadow: 0 5px 20px rgba(21,100,130,.07);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Tahoma, Arial, sans-serif;
  line-height: 1.8;
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}

button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 3px solid #79D7F2;
  outline-offset: 3px;
}

/* شاشة البداية */
#splash {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: linear-gradient(145deg,#FFFFFF,#DDF5FF);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity .4s ease;
}

.logo {
  width: 112px;
  height: 112px;
  border-radius: 32px;
  background: linear-gradient(145deg,#159FCA,#087FA5);
  color: white;
  display: grid;
  place-items: center;
  font-size: 57px;
  box-shadow: 0 12px 35px #159FCA40;
  margin-bottom: 15px;
}

#splash h1 { margin: 0; font-size: 30px; }
#splash p { color: var(--muted); margin: 3px 0; }
.loader {
  width: 36px;
  height: 36px;
  border: 4px solid #CBEAF6;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-top: 22px;
}
@keyframes spin { to { transform: rotate(360deg); } }

header {
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(12px);
}

.head-row {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  background: var(--soft);
  color: var(--primary-dark);
  border-radius: 13px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  font-size: 25px;
}

.brand h1 { font-size: 18px; margin: 0; }
.brand small { display: block; color: var(--muted); font-size: 11px; }

main {
  max-width: 760px;
  margin: auto;
  padding: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 19px;
  padding: 17px;
  margin-bottom: 15px;
  box-shadow: var(--shadow);
}

.hero {
  background: linear-gradient(135deg,#E1F7FF,#FFFFFF);
  border: 1px solid #C8EBF8;
  padding: 23px 19px;
}

.hero h2 { font-size: 25px; line-height: 1.5; margin: 0 0 7px; }
.hero p { color: var(--muted); margin: 0 0 15px; }

h2 { font-size: 19px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 0 0 7px; }

.muted { color: var(--muted); font-size: 13px; }

.grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 11px;
}

.tile {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 15px;
  text-align: right;
  color: var(--text);
  min-height: 120px;
  transition: transform .15s;
}
.tile:active { transform: scale(.98); }
.tile .emoji { font-size: 28px; display: block; }
.tile strong { display: block; margin: 4px 0; }
.tile small { color: var(--muted); }

.btn {
  border: 0;
  background: var(--primary);
  color: white;
  padding: 10px 15px;
  border-radius: 12px;
  font-weight: 650;
}
.btn:hover { background: var(--primary-dark); }
.btn.light {
  background: var(--soft);
  color: var(--primary-dark);
}
.btn.danger {
  background: #FFF0F1;
  color: var(--bad);
}

input {
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  background: white;
  color: var(--text);
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
}

.drug {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px;
  margin: 10px 0;
  background: white;
}

.drug-name { font-weight: 750; font-size: 16px; }
.drug small { color: var(--muted); }

details { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
summary { cursor: pointer; font-weight: 650; }
dt { color: var(--primary-dark); font-weight: 700; margin-top: 9px; }
dd { margin: 0; }

.option {
  display: block;
  width: 100%;
  text-align: right;
  background: white;
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin: 9px 0;
}
.option:disabled { opacity: .55; }
.option.correct { border-color: var(--good); background: #F0FFF7; }
.option.wrong { border-color: var(--bad); background: #FFF4F4; }

.notice {
  background: #FFF9E8;
  border: 1px solid #F1DFAD;
  border-radius: 12px;
  padding: 12px;
  font-size: 13px;
}

.source {
  display: block;
  color: var(--primary-dark);
  text-decoration: none;
  background: var(--soft);
  border-radius: 12px;
  padding: 11px 13px;
  margin: 9px 0;
  overflow-wrap: anywhere;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.row:last-child { border-bottom: 0; }

.badge {
  background: var(--soft);
  color: var(--primary-dark);
  border-radius: 30px;
  padding: 3px 10px;
  font-size: 12px;
}

.progress {
  height: 10px;
  border-radius: 10px;
  background: var(--border);
  overflow: hidden;
}
.progress div {
  height: 100%;
  background: var(--primary);
  transition: width .2s;
}

nav {
  position: fixed;
  z-index: 30;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  background: rgba(255,255,255,.97);
  border-top: 1px solid var(--border);
  padding: 7px 3px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter: blur(12px);
}

nav button {
  background: transparent;
  border: 0;
  color: var(--muted);
  flex: 1;
  padding: 4px 1px;
  font-size: 11px;
}
nav button span { display: block; font-size: 21px; }
nav button.active { color: var(--primary-dark); font-weight: 800; }

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 12px;
}

.hidden { display: none !important; }

@media (max-width: 360px) {
  main { padding: 10px; }
  .card { padding: 13px; }
  .tile { padding: 11px; }
}
</style>
</head>

<body>

<!-- شاشة البداية: استبدل الرمز بصورة شعارك لاحقاً -->
<div id="splash">
  <div class="logo" aria-label="شعار صيدليتي">⚕</div>
  <h1>صيدليتي</h1>
  <p>My Pharmacy</p>
  <p>التعلّم الصيدلاني بطريقة ذكية</p>
  <div class="loader"></div>
</div>

<header>
  <div class="head-row">
    <div class="brand">
      <div class="brand-icon">⚕</div>
      <div>
        <h1>صيدليتي</h1>
        <small>منصتك التعليمية الصيدلانية</small>
      </div>
    </div>
    <button class="btn light" onclick="saveProgress()">💾 حفظ</button>
  </div>
</header>

<main id="app"></main>

<nav>
  <button data-tab="home" onclick="showTab('home')"><span>🏠</span>الرئيسية</button>
  <button data-tab="cases" onclick="showTab('cases')"><span>🩺</span>الحالات</button>
  <button data-tab="drugs" onclick="showTab('drugs')"><span>💊</span>الأدوية</button>
  <button data-tab="inventory" onclick="showTab('inventory')"><span>📦</span>المخزون</button>
  <button data-tab="progress" onclick="showTab('progress')"><span>🏆</span>التقدم</button>
</nav>

<script>
"use strict";

const SAVE_KEY = "saydalati_medical_v3";

const cases = window.ILMO_CASES || [];

let state = {
  tab:"home",
  score:0,
  answered:0,
  inventory:{},
  caseIndex:0,
  lastAnswers:{}
};

drugs.forEach(d => {
  if (!state.inventory[d.id]) state.inventory[d.id] = 0;
});

function loadProgress() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (!saved) return;
    const parsed = JSON.parse(saved);
    state.score = Number(parsed.score) || 0;
    state.answered = Number(parsed.answered) || 0;
    state.inventory = Object.assign(state.inventory, parsed.inventory || {});
    state.caseIndex = Number(parsed.caseIndex) || 0;
    state.lastAnswers = parsed.lastAnswers || {};
  } catch (e) {
    console.warn("تعذر تحميل التقدم المحفوظ", e);
  }
}

function saveProgress() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      score:state.score,
      answered:state.answered,
      inventory:state.inventory,
      caseIndex:state.caseIndex,
      lastAnswers:state.lastAnswers
    }));
    alert("تم حفظ تقدمك على هذا الجهاز.");
  } catch (e) {
    alert("تعذر الحفظ. تحقق من مساحة التخزين وإعدادات المتصفح.");
  }
}

function showTab(tab) {
  state.tab = tab;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function homePage() {
  return `
    <section class="card hero">
      <span class="badge">منصة تعليمية للصيدلة</span>
      <h2>أهلاً بك في صيدليتي ⚕</h2>
      <p>تعلّم الأدوية، وراجع الحالات السريرية، وتابع تقدمك بواجهة طبية بسيطة.</p>
      <button class="btn" onclick="showTab('cases')">ابدأ التعلّم ←</button>
    </section>

    <section class="grid">
      <button class="tile" onclick="showTab('cases')">
        <span class="emoji">🩺</span>
        <strong>الحالات السريرية</strong>
        <small>تدريب على اتخاذ القرار</small>
      </button>
      <button class="tile" onclick="showTab('drugs')">
        <span class="emoji">💊</span>
        <strong>موسوعة الأدوية</strong>
        <small>بحث ومعلومات ومراجع</small>
      </button>
      <button class="tile" onclick="showTab('inventory')">
        <span class="emoji">📦</span>
        <strong>المخزون التعليمي</strong>
        <small>تجربة إدارة الكميات</small>
      </button>
      <button class="tile" onclick="showTab('progress')">
        <span class="emoji">🏆</span>
        <strong>تقدمي الدراسي</strong>
        <small>النقاط والإجابات</small>
      </button>
    </section>

    <section class="card">
      <h2>📚 مصادر طبية موثوقة</h2>
      <p class="muted">روابط خارجية للمراجعة. قد تكون بعض المصادر باللغة الإنجليزية.</p>
      <a class="source" target="_blank" rel="noopener" href="https://medlineplus.gov/druginformation.html">MedlinePlus — معلومات الأدوية</a>
      <a class="source" target="_blank" rel="noopener" href="https://dailymed.nlm.nih.gov/dailymed/">DailyMed — نشرات الأدوية</a>
      <a class="source" target="_blank" rel="noopener" href="https://www.who.int/health-topics/patient-safety">WHO — سلامة المرضى</a>
      <a class="source" target="_blank" rel="noopener" href="https://www.nhs.uk/medicines/">NHS — الأدوية والإرشادات</a>
    </section>

    <section class="notice">
      ⚠️ المعلومات لأغراض التعليم فقط، ولا تغني عن النشرة الرسمية أو التقييم الطبي. لا تستخدم هذا التطبيق وحده لاتخاذ قرارات علاجية.
    </section>`;
}

function drugsPage() {
  return `
    <section class="card">
      <h2>💊 موسوعة الأدوية</h2>
      <p class="muted">ابحث بالاسم العربي أو الإنجليزي أو التصنيف.</p>
      <input id="drugSearch" placeholder="مثال: Paracetamol أو باراسيتامول"
        oninput="filterDrugs(this.value)" aria-label="البحث عن دواء">
      <div id="drugList">${drugCards(drugs)}</div>
    </section>
    <section class="notice">
      المعلومات هنا مختصرة. راجع النشرة الرسمية لتفاصيل الجرعات وموانع الاستعمال والتداخلات.
    </section>`;
}

function drugCards(list) {
  if (!list.length) return "<p>لا توجد نتائج مطابقة.</p>";
  return list.map(d => `
    <article class="drug">
      <div class="drug-name">${d.name}</div>
      <small>${d.en} · ${d.class}</small>
      <details>
        <summary>عرض المعلومات والمصدر</summary>
        <dl>
          <dt>الاستعمال العام</dt><dd>${d.use}</dd>
          <dt>التحذيرات</dt><dd>${d.cautions}</dd>
          <dt>الآثار الجانبية المحتملة</dt><dd>${d.effects}</dd>
        </dl>
        <a class="source" target="_blank" rel="noopener" href="${d.source}">فتح المرجع الطبي الأصلي ↗</a>
      </details>
    </article>`).join("");
}

function filterDrugs(value) {
  const q = value.trim().toLowerCase();
  const found = drugs.filter(d =>
    [d.name,d.en,d.class,d.use].some(v => v.toLowerCase().includes(q))
  );
  document.getElementById("drugList").innerHTML = drugCards(found);
}

function casesPage() {
  const c = cases[state.caseIndex % cases.length];
  const previous = state.lastAnswers[state.caseIndex];
  return `
    <section class="card">
      <span class="badge">حالة ${(state.caseIndex % cases.length)+1} من ${cases.length}</span>
      <h2>${c.title}</h2>
      <p>${c.text}</p>
      ${c.options.map((option,i) => {
        let cls = "option";
        if (previous !== undefined && i === c.answer) cls += " correct";
        else if (previous === i) cls += " wrong";
        return `<button class="${cls}" ${previous !== undefined ? "disabled" : ""}
          onclick="answerCase(${i})">${option}</button>`;
      }).join("")}
      ${previous !== undefined ? `
        <p><strong>${previous === c.answer ? "إجابة صحيحة ✓" : "راجع الإجابة الصحيحة"}</strong></p>
        <p>${c.explanation}</p>
        <button class="btn" onclick="nextCase()">الحالة التالية ←</button>
      ` : ""}
    </section>
    <section class="notice">
      الحالات تعليمية، والقرار الحقيقي يعتمد على تقييم المريض والمراجع المعتمدة.
    </section>`;
}

function answerCase(choice) {
  const index = state.caseIndex % cases.length;
  if (state.lastAnswers[index] !== undefined) return;
  state.lastAnswers[index] = choice;
  state.answered++;
  if (choice === cases[index].answer) state.score += 10;
  saveSilently();
  render();
}

function nextCase() {
  state.caseIndex = (state.caseIndex + 1) % cases.length;
  render();
}

function inventoryPage() {
  return `
    <section class="card">
      <h2>📦 المخزون التعليمي</h2>
      <p class="muted">محاكاة للتعلّم فقط. هذه الكميات ليست مخزون صيدلية حقيقياً.</p>
      ${drugs.map(d => `
        <div class="row">
          <div>
            <strong>${d.name}</strong><br>
            <span class="muted">الكمية: ${Number(state.inventory[d.id]) || 0}</span>
          </div>
          <div style="display:flex;gap:5px">
            <button class="btn light" aria-label="إنقاص الكمية"
              onclick="changeStock('${d.id}',-1)">−</button>
            <button class="btn" aria-label="زيادة الكمية"
              onclick="changeStock('${d.id}',1)">+</button>
          </div>
        </div>
      `).join("")}
      <button class="btn light" onclick="saveProgress()">حفظ الكميات</button>
    </section>`;
}

function changeStock(id, amount) {
  state.inventory[id] = Math.max(0, (Number(state.inventory[id]) || 0) + amount);
  saveSilently();
  render();
}

function progressPage() {
  const percent = state.answered
    ? Math.round((state.score / (state.answered * 10)) * 100)
    : 0;
  return `
    <section class="card">
      <h2>🏆 تقدمك التعليمي</h2>
      <div class="row"><span>النقاط المكتسبة</span><strong>${state.score}</strong></div>
      <div class="row"><span>الحالات المجاب عنها</span><strong>${state.answered}</strong></div>
      <div class="row"><span>نسبة الإجابات الصحيحة</span><strong>${percent}%</strong></div>
      <div class="progress"><div style="width:${percent}%"></div></div>
      <p class="muted">تُحسب النقاط على أساس 10 نقاط لكل إجابة صحيحة.</p>
      <button class="btn" onclick="saveProgress()">حفظ التقدم</button>
      <button class="btn danger" onclick="resetProgress()">إعادة التقدم</button>
    </section>`;
}

function saveSilently() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      score:state.score,
      answered:state.answered,
      inventory:state.inventory,
      caseIndex:state.caseIndex,
      lastAnswers:state.lastAnswers
    }));
  } catch (e) {
    console.warn("تعذر حفظ التقدم", e);
  }
}

function resetProgress() {
  if (!confirm("هل تريد حذف النقاط والإجابات والكميات المحفوظة؟")) return;
  localStorage.removeItem(SAVE_KEY);
  state.score = 0;
  state.answered = 0;
  state.inventory = {};
  state.caseIndex = 0;
  state.lastAnswers = {};
  drugs.forEach(d => state.inventory[d.id] = 0);
  render();
}

function render() {
  const pages = {
    home:homePage,
    cases:casesPage,
    drugs:drugsPage,
    inventory:inventoryPage,
    progress:progressPage
  };
  document.getElementById("app").innerHTML = pages[state.tab]();
  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === state.tab);
  });
}

loadProgress();
render();

/* إخفاء شاشة البداية بعد 3 ثوانٍ */
window.setTimeout(() => {
  const splash = document.getElementById("splash");
  splash.style.opacity = "0";
  window.setTimeout(() => splash.remove(), 450);
}, 3000);
</script>
<script src="cases-data.js"></script>
<script>
<footer>
  صيدليتي © 2026 · منصة تعليمية صيدلانية
</footer>
<script src="cases-data.js"></script>
</body>
</html>
